[project]
name = "dealership-api"
version = "0.1.0"
description = "Car Dealership Inventory System API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.14,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "testcontainers[postgres]>=4.9,<5",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
